name: Release

# Cut a GitHub release whenever a version tag is pushed, e.g.
#   git tag -a v0.1.0b1 -m "..." && git push origin v0.1.0b1
# This mirrors the manual flow: test, build the sdist + wheel, and publish a
# release with both artifacts attached. PEP 440 pre-releases (…a1/b1/rc1) are
# automatically flagged as a GitHub pre-release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # required for `gh release create`

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Verify the tag matches the package version
        run: |
          version=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match pyproject version '$version'. Bump the version before tagging." >&2
            exit 1
          fi
          echo "Releasing version $version"

      - name: Run tests
        run: uv run pytest -q

      - name: Type-check
        run: uv run --with pyright pyright src tests

      - name: Build sdist + wheel
        run: uv build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Flag a/b/rc PEP 440 pre-releases (e.g. v0.1.0b1) as GitHub pre-releases.
          prerelease=""
          if printf '%s' "${GITHUB_REF_NAME}" | grep -Eq '(a|b|rc)[0-9]+$'; then
            prerelease="--prerelease"
          fi
          gh release create "${GITHUB_REF_NAME}" \
            $prerelease \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*
