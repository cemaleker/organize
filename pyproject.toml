[project]
name = "inbox-cleaner"
version = "0.1.0"
description = "Fetch, index, group, filter, and safely clean a neglected Gmail inbox."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "cemal", email = "cemaleker@pm.me" }]
keywords = ["gmail", "email", "inbox", "cli", "tui", "cleanup"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
    "Topic :: Utilities",
]
dependencies = [
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.2",
    "textual>=0.80",
    "tenacity>=9.0",
]

[project.urls]
Homepage = "https://github.com/cemaleker/organize"
Repository = "https://github.com/cemaleker/organize"
Issues = "https://github.com/cemaleker/organize/issues"

[project.scripts]
inbox-cleaner = "inbox_cleaner.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inbox_cleaner"]
